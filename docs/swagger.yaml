basePath: /api/v1
definitions:
  create_genre.Input:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  create_genre.Output:
    properties:
      genre:
        $ref: '#/definitions/domain.Genre'
    type: object
  delete_genre.Output:
    properties:
      success:
        type: boolean
    type: object
  domain.Book:
    properties:
      author:
        type: string
      chapterPaths:
        items:
          type: string
        type: array
      cover:
        type: string
      genres:
        items:
          $ref: '#/definitions/domain.Genre'
        type: array
      id:
        type: string
      title:
        type: string
    type: object
  domain.DictionaryExample:
    properties:
      dictionaryID:
        type: string
      id:
        type: string
      text:
        type: string
      translatedText:
        type: string
      wordPositionEnd:
        type: integer
      wordPositionStart:
        type: integer
    type: object
  domain.DictionaryWord:
    properties:
      examples:
        items:
          $ref: '#/definitions/domain.DictionaryExample'
        type: array
      fromLangCode:
        type: string
      id:
        type: string
      partOfSpeech:
        type: string
      text:
        type: string
      toLangCode:
        type: string
      transcription:
        type: string
      translations:
        items:
          type: string
        type: array
    type: object
  domain.EmailPasswordAccount:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  domain.Genre:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  domain.GoogleAccount:
    properties:
      email:
        type: string
      emailVerified:
        type: boolean
      name:
        type: string
      picture:
        type: string
      sub:
        type: string
    type: object
  domain.JsonB:
    additionalProperties: {}
    type: object
  domain.PersonalUserBook:
    properties:
      author:
        type: string
      chapterPaths:
        items:
          type: string
        type: array
      cover:
        type: string
      genres:
        items:
          $ref: '#/definitions/domain.Genre'
        type: array
      id:
        type: string
      title:
        type: string
      userId:
        type: string
    type: object
  domain.User:
    properties:
      emailPasswordAccount:
        $ref: '#/definitions/domain.EmailPasswordAccount'
      googleAccount:
        $ref: '#/definitions/domain.GoogleAccount'
      id:
        type: string
      isAdmin:
        type: boolean
      isVIP:
        type: boolean
      metadata:
        $ref: '#/definitions/domain.JsonB'
      personalUserBooks:
        items:
          $ref: '#/definitions/domain.PersonalUserBook'
        type: array
    type: object
  get_book.Output:
    properties:
      book:
        $ref: '#/definitions/domain.Book'
    type: object
  get_books.Output:
    properties:
      books:
        items:
          $ref: '#/definitions/domain.Book'
        type: array
    type: object
  get_genre.Output:
    properties:
      genre:
        $ref: '#/definitions/domain.Genre'
    type: object
  get_genres.Output:
    properties:
      genres:
        items:
          $ref: '#/definitions/domain.Genre'
        type: array
    type: object
  google_login.Input:
    properties:
      idToken:
        type: string
    required:
    - idToken
    type: object
  google_login.Output:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  login.Input:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  login.Output:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  logout.Output:
    properties:
      success:
        type: boolean
    type: object
  lookup.Input:
    properties:
      fromLang:
        type: string
      text:
        type: string
      toLang:
        type: string
    required:
    - fromLang
    - text
    - toLang
    type: object
  lookup.Output:
    properties:
      words:
        items:
          $ref: '#/definitions/domain.DictionaryWord'
        type: array
    type: object
  notification.Input:
    properties:
      body:
        type: string
      title:
        type: string
    type: object
  refresh.Input:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  refresh.Output:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  register.Input:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  register.Output:
    properties:
      success:
        type: boolean
    type: object
  update_book.Output:
    properties:
      book:
        $ref: '#/definitions/domain.Book'
    type: object
  update_genre.Input:
    properties:
      id:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - id
    - name
    type: object
  update_genre.Output:
    properties:
      genre:
        $ref: '#/definitions/domain.Genre'
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
info:
  contact: {}
  title: Nim2Book api
  version: "1.0"
paths:
  /auth/google-login:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/google_login.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/google_login.Output'
      summary: GoogleLogin user
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/login.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/login.Output'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/logout.Output'
      summary: Logout user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        schema:
          $ref: '#/definitions/refresh.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refresh.Output'
      summary: Refresh user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/register.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/register.Output'
      summary: Register user
      tags:
      - auth
  /book:
    get:
      parameters:
      - description: Author filter
        in: query
        name: author
        type: string
      - description: Title filter
        in: query
        name: title
        type: string
      - description: Genre ID filter
        in: query
        name: genreId
        type: string
      - description: Page number
        in: query
        name: page
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/get_books.Output'
      summary: Get books
      tags:
      - book
  /book/{id}:
    get:
      parameters:
      - description: Book id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/get_book.Output'
      summary: Get book by id
      tags:
      - book
    put:
      parameters:
      - description: Cover file
        in: formData
        name: cover
        type: file
      - description: Author book
        in: formData
        name: author
        type: string
      - description: Title book
        in: formData
        name: title
        type: string
      - description: Book id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/update_book.Output'
      security:
      - BearerAuth: []
      summary: Update book
      tags:
      - book
  /dictionary/lookup:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/lookup.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lookup.Output'
      summary: Get list translate from dictionary
      tags:
      - dictionary
  /file/public:
    get:
      parameters:
      - description: path
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get file data
      tags:
      - file
  /genre:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/get_genres.Output'
      summary: Get all genres
      tags:
      - genre
    post:
      consumes:
      - application/json
      parameters:
      - description: Genre data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/create_genre.Input'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/create_genre.Output'
      security:
      - BearerAuth: []
      summary: Create genre
      tags:
      - genre
  /genre/{id}:
    delete:
      parameters:
      - description: Genre id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delete_genre.Output'
      security:
      - BearerAuth: []
      summary: Delete genre
      tags:
      - genre
    get:
      parameters:
      - description: Genre id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/get_genre.Output'
      summary: Get genre by id
      tags:
      - genre
    put:
      consumes:
      - application/json
      parameters:
      - description: Genre id
        in: path
        name: id
        required: true
        type: string
      - description: Genre data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/update_genre.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/update_genre.Output'
      security:
      - BearerAuth: []
      summary: Update genre
      tags:
      - genre
  /notification/test:
    post:
      consumes:
      - application/json
      parameters:
      - description: body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/notification.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Notification test
      tags:
      - notification
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
