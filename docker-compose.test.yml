version: "3.8"

services:
    postgres-test:
        image: postgres:17-alpine
        container_name: nim2book-postgres-test
        environment:
            POSTGRES_USER: testuser
            POSTGRES_PASSWORD: testpassword
            POSTGRES_DB: nim2book_test
        ports:
            - "5433:5432"
        volumes:
            - postgres-test-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U testuser -d nim2book_test"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis-test:
        image: redis:7-alpine
        container_name: nim2book-redis-test
        ports:
            - "6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    minio-test:
        image: minio/minio:latest
        container_name: nim2book-minio-test
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: testminio
            MINIO_ROOT_PASSWORD: testminio123
        ports:
            - "9001:9000"
            - "9002:9001"
        volumes:
            - minio-test-data:/data
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Create buckets in MinIO for testing
    minio-init:
        image: minio/mc:latest
        container_name: nim2book-minio-init-test
        depends_on:
            minio-test:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            sleep 5;
            /usr/bin/mc alias set myminio http://minio-test:9000 testminio testminio123;
            /usr/bin/mc mb myminio/books --ignore-existing;
            /usr/bin/mc mb myminio/chapters --ignore-existing;
            /usr/bin/mc mb myminio/cover --ignore-existing;
            /usr/bin/mc anonymous set public myminio/books;
            /usr/bin/mc anonymous set public myminio/chapters;
            /usr/bin/mc anonymous set public myminio/cover;
            exit 0;
            "

volumes:
    postgres-test-data:
    minio-test-data:

networks:
    default:
        name: nim2book-test-network
