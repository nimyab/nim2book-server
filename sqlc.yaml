version: "2"

sql:
    - engine: "postgresql"
      queries: "db/sqlc/queries"
      schema: "db/sqlc/schema.sql"
      gen:
          go:
              package: "sqlc"
              out: "db/sqlc"
              sql_package: "pgx/v5"
              emit_pointers_for_null_types: true
              overrides:
                  - db_type: "uuid"
                    nullable: true
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"

                  - column: "*.id"
                    go_type:
                        import: "github.com/nimyab/nim2book-back/internal/domain"
                        type: "Id"
